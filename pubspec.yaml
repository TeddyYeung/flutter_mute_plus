name: flutter_mute_plus
description: Check or toggle the device ringer mode (normal, silent, vibrate). A maintained fork of flutter_mute with AGP 8/9, Xcode 16 and Swift Package Manager support.
version: 1.1.0
repository: https://github.com/TeddyYeung/flutter_mute_plus
issue_tracker: https://github.com/TeddyYeung/flutter_mute_plus/issues
topics:
  - mute
  - ringer
  - silent-mode
  - vibrate

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.teddyyeung.flutter_mute_plus
        pluginClass: FlutterMutePlusPlugin
      ios:
        pluginClass: FlutterMutePlusPlugin
